name: Checks
# shellcheck and the test suite, as steps of one job: GitHub bills every job for
# at least a full minute, and both finish in seconds. Pull requests only, and
# not while the PR is a draft. Docs-only changes skip it.
#
# Linux only. The tests stub both BSD and GNU date, so a macOS runner (billed at
# ten times the rate) would not cover anything more.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '**.txt'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: ✅ Checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      # Prebuilt release binary, checked against the SHA-256 GitHub records for
      # the asset. To bump, change both values.
      - name: 🔧 Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "${archive}"
          sudo install -m 755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: 🧹 shellcheck
        run: shellcheck statusline.sh install.sh tests/*.sh

      # jq ships on the ubuntu-latest image.
      - name: 🧪 Tests
        run: bash tests/run.sh
